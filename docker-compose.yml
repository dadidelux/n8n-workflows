volumes:
  postgres_data:
  redis_data:
  n8n_data:
  n8n_video_tmp:

networks:
  n8n_network:
    driver: bridge

x-n8n-common: &n8n-common
  build:
    context: .
    dockerfile: Dockerfile
  image: n8n-ffmpeg:local
  networks:
    - n8n_network
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - EXECUTIONS_MODE=queue
    - NODES_EXCLUDE=["n8n-nodes-base.localFileTrigger"]
    - N8N_RESTRICT_FILE_ACCESS_TO=/data/video-tmp;~/.n8n-files
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_BULL_REDIS_PORT=6379
    - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_HOST=${N8N_HOST}
    - N8N_PORT=5678
    - N8N_PROTOCOL=${N8N_PROTOCOL}
    - WEBHOOK_URL=${WEBHOOK_URL}
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    - N8N_LOG_LEVEL=${N8N_LOG_LEVEL}
    - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
    - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    networks:
      - n8n_network
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - n8n_network
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  n8n-main:
    <<: *n8n-common
    container_name: n8n-main
    command: start
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_video_tmp:/data/video-tmp
    restart: unless-stopped

  n8n-worker-1:
    <<: *n8n-common
    container_name: n8n-worker-1
    command: worker --concurrency=${WORKER_CONCURRENCY}
    volumes:
      - n8n_video_tmp:/data/video-tmp
    restart: unless-stopped

  n8n-worker-2:
    <<: *n8n-common
    container_name: n8n-worker-2
    command: worker --concurrency=${WORKER_CONCURRENCY}
    volumes:
      - n8n_video_tmp:/data/video-tmp
    restart: unless-stopped

  n8n-worker-3:
    <<: *n8n-common
    container_name: n8n-worker-3
    command: worker --concurrency=${WORKER_CONCURRENCY}
    volumes:
      - n8n_video_tmp:/data/video-tmp
    restart: unless-stopped
